# SPDX-License-Identifier: LGPL-2.1-or-later
name: CI

# The keyring packages themselves are built and judged by release.yml, which
# rehearses on every push that touches what they are built from.
on:
  push:
    branches: [main, 'ci/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions: {}

jobs:
  gates:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Shared gates
        # From one copy in LibreSCRS/ci: every job bounded and every shared
        # action at one commit, and the CHANGELOG agreeing with VERSION. The
        # rpm spec's Version is held to VERSION by the release preflight, which
        # every push touching the packaging rehearses.
        uses: LibreSCRS/ci/actions/gates@b9848b4990ae046072497f10d6f5b2bfdfa45470
        with:
          gates: check-workflows check-version-lockstep
