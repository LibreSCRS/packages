# SPDX-License-Identifier: LGPL-2.1-or-later
name: Publish

# assemble -> sign-index -> probe -> deploy -> aur, and keepalive on the
# schedule.
#
# Nothing is kept in git: every run builds the tree from the releases of the
# six repositories and carries the previous generation over from the live site
# (https://librescrs.github.io/packages/), so a client holding a cached index
# finds every file it names. The shared steps live in LibreSCRS/ci, pinned by
# commit below.
#
# A publish (a dispatch from release-train, or the weekly schedule) runs on
# main only: it signs the indexes with the real index key, deploys to Pages
# and publishes the Arch recipes to the AUR. A rehearsal takes the rehearsal
# runs of the six repositories, signs with the public rehearsal key, and
# neither deploys nor touches the AUR.
#
# Before the first release (a scheduled run, no code release >= 5.0.0, nothing
# on the live site) assemble says "not yet published", sets published=false
# and every job after it is skipped: the run is green.
#
# --- To be measured on the first runs on the runner, and written here ---------
# - Whether this repository's GITHUB_TOKEN (actions: read) can download the
#   artifacts of the rehearsal runs of the six public repositories (assemble,
#   fetch-releases on a rehearsal). If it cannot, fetch-releases takes a
#   fine-grained token (actions: read on the six repositories) from an
#   environment `rehearse-read` instead.
# - Whether keepalive's enable call resets GitHub's 60-day inactivity counter
#   of the schedule. If it does not, the guard on the live Valid-Until in
#   LibreSCRS/ci is the fallback, and the owner decides.
# - The durations of assemble, the probe legs and aur, against the
#   timeout-minutes below.
# ------------------------------------------------------------------------------
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'rehearse (any ref) or publish (main only)'
        type: choice
        options: [publish, rehearse]
        default: rehearse
      runs:
        description: 'rehearse: "<Repository>=<run id> ..." of the six release rehearsals'
        default: ''
  schedule:
    - cron: '17 4 * * 1'   # weekly: re-sign before Valid-Until (30 days) runs out

permissions: {}

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  assemble:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
      attestations: read
    outputs:
      mode: ${{ steps.m.outputs.mode }}
      published: ${{ steps.a.outputs.published }}
      prev: ${{ steps.p.outputs.prev }}
      tag_lm: ${{ steps.t.outputs.tag_lm }}
      tag_la: ${{ steps.t.outputs.tag_la }}
      tag_ll: ${{ steps.t.outputs.tag_ll }}
      tag_lc: ${{ steps.t.outputs.tag_lc }}
      tag_lk: ${{ steps.t.outputs.tag_lk }}
    steps:
      - id: m
        name: Mode
        env:
          EVENT: ${{ github.event_name }}
          INPUT_MODE: ${{ inputs.mode }}
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = schedule ]; then mode=publish; else mode="$INPUT_MODE"; fi
          case "$mode" in
            publish)
              # The index key, Pages and the AUR are reached from main only;
              # a publish elsewhere would be a green run that published nothing.
              [ "$REF" = refs/heads/main ] || { echo "::error::a publish runs on main, not $REF"; exit 1; } ;;
            rehearse) ;;
            *) echo "::error::mode '$mode' is neither publish nor rehearse"; exit 1 ;;
          esac
          echo "mode=$mode" >> "$GITHUB_OUTPUT"

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2
        with:
          cosign-release: v3.0.6

      - name: Releases, verified
        uses: LibreSCRS/ci/actions/pkg-repo@b9848b4990ae046072497f10d6f5b2bfdfa45470
        env:
          GH_TOKEN: ${{ github.token }}
          RUNS: ${{ inputs.runs }}
        with:
          step: fetch-releases
          mode: ${{ steps.m.outputs.mode }}
          tree: pub/releases

      - name: Previous generation
        if: steps.m.outputs.mode == 'publish'
        uses: LibreSCRS/ci/actions/pkg-repo@b9848b4990ae046072497f10d6f5b2bfdfa45470
        with:
          step: fetch-prev
          mode: ${{ steps.m.outputs.mode }}
          tree: pub/prev

      - name: No previous generation on a rehearsal
        # The live site is signed with the real index key; a rehearsal tree is
        # wholly under the rehearsal key and carries nothing over from it.
        if: steps.m.outputs.mode == 'rehearse'
        run: |
          set -euo pipefail
          mkdir -p pub/prev
          echo "rehearsal: the published generation is under the real index key, not the rehearsal key" > pub/prev/EMPTY
          cat pub/prev/EMPTY

      - name: Assemble
        id: a
        uses: LibreSCRS/ci/actions/pkg-repo@b9848b4990ae046072497f10d6f5b2bfdfa45470
        with:
          step: assemble
          mode: ${{ steps.m.outputs.mode }}
          releases: pub/releases
          prev: pub/prev
          tree: pub/tree

      - id: p
        name: Is there a previous generation
        run: |
          set -euo pipefail
          if [ -e pub/prev/EMPTY ]; then
            echo "no previous generation: $(head -n 1 pub/prev/EMPTY)"
            echo "prev=false" >> "$GITHUB_OUTPUT"
          else
            echo "prev=true" >> "$GITHUB_OUTPUT"
          fi

      - id: t
        name: The release tag of each recipe
        # The newest release of each code repository is what the AUR gets.
        if: steps.m.outputs.mode == 'publish' && steps.a.outputs.published == 'true'
        run: |
          set -euo pipefail
          for pair in lm=LibreMiddleware la=LibreAgent ll=LibreLinux lc=LibreCelik lk=LibreKDE; do
            key="${pair%%=*}" repo="${pair#*=}"
            tag="$(find "pub/releases/$repo" -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | sort -V | tail -n 1)"
            [[ "$tag" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] \
              || { echo "::error::$repo: no release tag under pub/releases/$repo (newest: '$tag')"; exit 1; }
            echo "$repo $tag"
            echo "tag_$key=$tag" >> "$GITHUB_OUTPUT"
          done

      - if: steps.a.outputs.published == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: tree-unsigned
          path: pub/tree
          if-no-files-found: error
          retention-days: 3

      # For the probe's upgrade and key steps; none when nothing is published.
      - if: steps.a.outputs.published == 'true' && steps.p.outputs.prev == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: tree-prev
          path: pub/prev
          if-no-files-found: error
          retention-days: 3

  sign-index:
    # One job for both modes, as release.yml's sign: only a publish binds the
    # environment that holds the index key. A rehearsal has no environment, so
    # no key reaches it, and pkg-repo refuses one that does. One job also keeps
    # the jobs after it on plain `needs`: no condition has to reason about a
    # skipped sibling.
    needs: [assemble]
    if: needs.assemble.outputs.published == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions: {}
    environment: ${{ needs.assemble.outputs.mode == 'publish' && 'index-signing' || '' }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: tree-unsigned
          path: pub/tree
      - name: Sign the indexes
        uses: LibreSCRS/ci/actions/pkg-repo@b9848b4990ae046072497f10d6f5b2bfdfa45470
        with:
          step: sign-index
          mode: ${{ needs.assemble.outputs.mode }}
          tree: pub/tree
          key: ${{ needs.assemble.outputs.mode == 'publish' && secrets.INDEX_SIGNING_KEY || '' }}
      - name: Verify the signed tree
        uses: LibreSCRS/ci/actions/pkg-repo@b9848b4990ae046072497f10d6f5b2bfdfa45470
        with:
          step: verify-tree
          mode: ${{ needs.assemble.outputs.mode }}
          tree: pub/tree
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: tree-signed
          path: pub/tree
          if-no-files-found: error
          retention-days: 3

  probe:
    # Install from the signed tree in clean containers, as a user would. The
    # ubuntu2604 leg runs apt twice, verifying with gpgv and with sqv.
    #
    # The probe steps follow the mode; no tree is ever re-keyed:
    # - rehearse: the tree is wholly under the rehearsal key -> "p1p2 forge".
    #   upgrade and key are skipped: the published previous generation is
    #   under the real key.
    # - publish: the real tree -> "p1p2 upgrade key" against tree-prev; without
    #   tree-prev (the first publish) --prev is left out and the probe skips
    #   upgrade and key, saying so. forge is skipped: it signs its forgeries
    #   with the probe key, which a tree under the real key does not trust; the
    #   release rehearsal and LibreSCRS/ci's docker selftests exercise it.
    name: probe (${{ matrix.slug }})
    needs: [assemble, sign-index]
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        slug: [debian13, ubuntu2604, fedora43, fedora44, opensusetw]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          sparse-checkout: install
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: tree-signed
          path: pub/tree
      - if: needs.assemble.outputs.mode == 'publish' && needs.assemble.outputs.prev == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: tree-prev
          path: pub/prev
      - name: What this mode probes
        env:
          MODE: ${{ needs.assemble.outputs.mode }}
          PREV: ${{ needs.assemble.outputs.prev }}
        run: |
          set -euo pipefail
          if [ "$MODE" = publish ]; then
            echo "publish: p1p2 upgrade key; forge skipped: it needs the probe key, and is exercised by the release rehearsal and the ci docker selftests"
            [ "$PREV" = true ] || echo "publish: no previous generation (first publish): upgrade and key skipped by the probe"
          else
            echo "rehearse: p1p2 forge; upgrade and key skipped: the published previous generation is under the real key"
          fi
      - name: Probe ${{ matrix.slug }}
        uses: LibreSCRS/ci/actions/pkg-repo@b9848b4990ae046072497f10d6f5b2bfdfa45470
        with:
          step: probe
          tree: pub/tree
          install-dir: install
          slugs: ${{ matrix.slug }}
          keyset: ${{ needs.assemble.outputs.mode == 'publish' && 'package-signing' || 'rehearsal' }}
          steps: ${{ needs.assemble.outputs.mode == 'publish' && 'p1p2 upgrade key' || 'p1p2 forge' }}
          prev: ${{ needs.assemble.outputs.mode == 'publish' && needs.assemble.outputs.prev == 'true' && 'pub/prev' || '' }}

  deploy:
    needs: [assemble, probe]
    if: needs.assemble.outputs.mode == 'publish' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.d.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: tree-signed
          path: pub/tree
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        with:
          path: pub/tree
      - id: d
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346  # v5.0.1

  aur:
    # After the deploy, the newest release of each code repository, its
    # recipe unchanged. "Re-run failed jobs" on a red aur re-runs aur alone,
    # never deploy, and aur-publish is idempotent (nothing changed, nothing
    # pushed; nothing is pushed unless every pkgbase is green), so a re-run
    # is safe.
    needs: [assemble, deploy]
    if: needs.assemble.outputs.mode == 'publish' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    environment: aur
    steps:
      # Each at its release tag, sparse, with the git index (aur-publish reads
      # the submodule pins from it): the recipe and its README, KEYS, VERSION,
      # the ci.yml the recipe gate's options are read from, and the file those
      # options name (LibreAgent's --pin reads cmake/FetchQCBOR.cmake).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: LibreSCRS/LibreMiddleware
          ref: ${{ needs.assemble.outputs.tag_lm }}
          path: sources/LibreMiddleware
          sparse-checkout: |
            /packaging/arch/
            /KEYS
            /VERSION
            /.github/workflows/ci.yml
            /cmake/FetchQCBOR.cmake
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: LibreSCRS/LibreAgent
          ref: ${{ needs.assemble.outputs.tag_la }}
          path: sources/LibreAgent
          sparse-checkout: |
            /packaging/arch/
            /KEYS
            /VERSION
            /.github/workflows/ci.yml
            /cmake/FetchQCBOR.cmake
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: LibreSCRS/LibreLinux
          ref: ${{ needs.assemble.outputs.tag_ll }}
          path: sources/LibreLinux
          sparse-checkout: |
            /packaging/arch/
            /KEYS
            /VERSION
            /.github/workflows/ci.yml
            /cmake/FetchQCBOR.cmake
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: LibreSCRS/LibreCelik
          ref: ${{ needs.assemble.outputs.tag_lc }}
          path: sources/LibreCelik
          sparse-checkout: |
            /packaging/arch/
            /KEYS
            /VERSION
            /.github/workflows/ci.yml
            /cmake/FetchQCBOR.cmake
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: LibreSCRS/LibreKDE
          ref: ${{ needs.assemble.outputs.tag_lk }}
          path: sources/LibreKDE
          sparse-checkout: |
            /packaging/arch/
            /KEYS
            /VERSION
            /.github/workflows/ci.yml
            /cmake/FetchQCBOR.cmake
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Publish the recipes
        uses: LibreSCRS/ci/actions/pkg-repo@b9848b4990ae046072497f10d6f5b2bfdfa45470
        with:
          step: aur
          sources: sources
          ssh-key: ${{ secrets.AUR_SSH_KEY }}

  keepalive:
    # GitHub disables a schedule after 60 days without activity in the
    # repository, silently. Run whatever the publish did: a red weekly run is
    # the warning, and it must keep coming.
    needs: [assemble]
    if: ${{ !cancelled() && github.event_name == 'schedule' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Keep the schedule enabled
        uses: LibreSCRS/ci/actions/pkg-repo@b9848b4990ae046072497f10d6f5b2bfdfa45470
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          step: keepalive
